name: CEESP - Contribution patients

on:
  push:
    branches:
      - main

  schedule:
    - cron: "15 14 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:

    runs-on: ubuntu-latest

    steps:

      - name: Récupérer le repository
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          pip install -r requirements.txt

      - name: Vérifier le tableau HAS
        env:
          TEAMS_WEBHOOK: ${{ secrets.TEAMS_WEBHOOK }}
        run: |
          python ceesp_monitor.py

      - name: Sauvegarder l'historique
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add history.csv

          if git diff --cached --quiet; then

            echo "Aucune modification de history.csv."

          else

            git commit \
              -m "Update CEESP contribution patients history"

            git push

          fi
